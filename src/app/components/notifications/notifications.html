<section class="card" id="notifications">
<div class="icon">#</div>
<div>
<h2>Zone de notifications</h2>
<p>Vous avez {{notifications().length}} nouvelles notifications.</p>
<button (click)="showNotifications()">{{btnTxt}}</button>
@if(show()){
  @for (item of notifications(); track item.message ){
    <p class="notification">{{item.message}}</p>
  }
}
</div>
</section>
